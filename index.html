<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Pilot | AI DeFi on Flow & EVM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.4",
          "react-dom": "https://esm.sh/react-dom@19.2.4",
          "react-dom/client": "https://esm.sh/react-dom@19.2.4/client",
          "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
          "@onflow/fcl": "https://esm.sh/@onflow/fcl@1.15.0?bundle",
          "ethers": "https://esm.sh/ethers@6.13.2"
        }
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #050505;
        color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .glow-green {
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
      }
      .glow-blue {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
    <script>
      // Crucial Shims: Must be defined before ANY modules load
      window.global = window;
      window.process = {
        env: { NODE_ENV: "production" },
        nextTick: (cb) => setTimeout(cb, 0),
        listeners: () => [],
        browser: true,
        version: "",
        argv: [],
      };
      // Polyfill for Buffer if needed
      if (typeof window !== "undefined" && !window.Buffer) {
        import("https://esm.sh/buffer@6.0.3").then(({ Buffer }) => {
          window.Buffer = Buffer;
        });
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
